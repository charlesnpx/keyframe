[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyframe"
version = "0.5.2"
description = "Extract key frames and transcripts from video files using CLIP, Florence-2, and Whisper"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "opencv-python",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "open-clip-torch",
    "transformers>=4.50,<5",
    "huggingface-hub>=0.34,<1",
    "scikit-learn",
    "numpy",
    "pillow",
    "openai-whisper",
    "whisperx==3.8.6",
    "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23.0.0'",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23.0.0'",
    "scenedetect[opencv]",
    "tqdm",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.optional-dependencies]
paddle = [
    "paddlepaddle",
    "paddleocr",
]

[project.scripts]
keyframe = "keyframe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["keyframe"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "skill"

[tool.pytest.ini_options]
markers = [
    "slow: opt-in QA fixture tests that run full local recordings",
    "hardware: opt-in tests that execute real local model hardware",
    "mlx: opt-in tests that require a supported Apple MLX runtime",
    "cuda: opt-in tests that require an available CUDA runtime",
]

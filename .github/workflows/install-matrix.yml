name: Clean install matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            python: "3.11"
          - os: macos-14
            platform: darwin-arm64
            python: "3.12"
          - os: macos-14
            platform: darwin-arm64
            python: "3.13"
          - os: ubuntu-24.04
            platform: linux-x86_64
            python: "3.11"
          - os: ubuntu-24.04
            platform: linux-x86_64
            python: "3.12"
          - os: ubuntu-24.04
            platform: linux-x86_64
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install CPU Torch wheels on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
      - name: Build wheel and sdist, then install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/keyframe-*.whl
      - name: Validate distribution, imports, and MLX platform gate
        run: python scripts/validate_install.py --expect-platform ${{ matrix.platform }}
      - name: Run release suite
        run: |
          python -m pip install pytest
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
